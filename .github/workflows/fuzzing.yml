name: Fuzzing

# A 60-second random exploration is not a repeatable merge gate, so it runs
# weekly and on demand rather than on pull requests, and no gate
# requires it. The ordinary Rust tests replay the same target and seed corpus.
on:
  schedule:
    - cron: "57 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzzing:
    name: fuzz the source and help-result parsers
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust nightly
        run: rustup toolchain install nightly-2026-10-15 --profile minimal
      - name: Install the pinned fuzzer
        env:
          CARGO_FUZZ_VERSION: "0.13.2"
          # install-action has no cargo-fuzz manifest, so the release asset is
          # checked against GitHub's digest for it at pin time.
          CARGO_FUZZ_SHA256: "b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c"
        run: |
          set -euo pipefail
          asset="cargo-fuzz-${CARGO_FUZZ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --proto-redir '=https' -sSLO "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${CARGO_FUZZ_VERSION}/$asset"
          echo "${CARGO_FUZZ_SHA256}  $asset" | sha256sum --check
          tar -xzf "$asset" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-fuzz
      - name: Fetch the locked target dependencies
        run: cargo fetch --locked --manifest-path tools/ozzit/fuzz/Cargo.toml
      - name: Copy the seed corpus
        run: cp -R fuzz/corpus "$RUNNER_TEMP/ozzit-fuzz-corpus"
      # The release binary is built for musl and defaults to that target,
      # where the address sanitiser cannot build; fuzz on glibc instead.
      - name: Fuzz the parsers
        working-directory: tools/ozzit
        env:
          CARGO_NET_OFFLINE: "true"
        run: >-
          cargo +nightly-2026-10-15 fuzz run --target x86_64-unknown-linux-gnu parsers
          "$RUNNER_TEMP/ozzit-fuzz-corpus" --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024
