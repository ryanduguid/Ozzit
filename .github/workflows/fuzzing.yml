name: Fuzzing

# A 60-second random exploration is not a repeatable merge gate, so it runs
# after merge, weekly and on demand rather than on pull requests, and no gate
# requires it. The ordinary Rust tests replay the same target and seed corpus.
on:
  push:
    branches: [main]
  schedule:
    - cron: "57 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzzing:
    name: fuzz the source and help-result parsers
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust nightly
        run: rustup toolchain install nightly-2026-10-15 --profile minimal
      - name: Install the pinned fuzzer
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fetch the locked target dependencies
        run: cargo fetch --locked --manifest-path tools/ozzit/fuzz/Cargo.toml
      - name: Copy the seed corpus
        run: cp -R fuzz/corpus "$RUNNER_TEMP/ozzit-fuzz-corpus"
      - name: Fuzz the parsers
        working-directory: tools/ozzit
        env:
          CARGO_NET_OFFLINE: "true"
        run: >-
          cargo +nightly-2026-10-15 fuzz run parsers
          "$RUNNER_TEMP/ozzit-fuzz-corpus" --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024
