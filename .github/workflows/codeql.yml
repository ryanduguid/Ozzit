name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull request run is cancelled. Every other run is keyed on its commit, so
# a later push to main cannot cancel or replace the analysis of an earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    timeout-minutes: 15
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Upload CodeQL results for this job only.
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"

  codeql-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [analyze]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Build the native aggregate gate
        run: cargo build --locked --manifest-path tools/ozzit/Cargo.toml
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: tools/ozzit/target/debug/ozzit check_gates .github/workflows/codeql.yml codeql-gates
