name: Verify workbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On a pull request, a push that supersedes an earlier one cancels it rather than
# paying for both. Every other run is keyed on its commit, as the attribution workflow's
# are: a shared group would let a later push to main replace a pending run, and that
# merged commit would never be verified.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The gates only read files. Nothing here needs write access to the repository.
permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install the pinned linter
        run: python -m pip install --only-binary ':all:' --require-hashes --requirement requirements-ruff.txt
      - name: Lint the workbook tools and their tests
        run: python -m ruff check .
      - name: Install the pinned type checker
        run: python -m pip install --only-binary ':all:' --require-hashes --requirement requirements-mypy.txt
      - name: Type-check production workbook tools
        run: python -m mypy --config-file mypy.ini
      # actionlint runs shellcheck over the run: scripts; the repository
      # tracks no shell files of its own. Each release asset is checked against
      # the digest recorded at pin time (koalaman publishes no checksums file).
      - name: Install the pinned shell linter
        run: curl --proto '=https' --proto-redir '=https' -sSLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz && echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck-v0.11.0.linux.x86_64.tar.xz" | sha256sum --check && tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz shellcheck-v0.11.0/shellcheck
      - name: Install the pinned workflow linter
        run: curl --proto '=https' --proto-redir '=https' -sSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz && echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum --check && tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
      - name: Lint the workflows and their scripts
        run: ./actionlint -shellcheck ./shellcheck-v0.11.0/shellcheck

  verify:
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release manifest pins the commit that last changed ozzit.xlsx.
          # A shallow clone cannot prove that historical claim.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the pinned citation parser
        run: python -m pip install --only-binary ':all:' --require-hashes --requirement requirements-citation.txt
      - name: Run tool regression tests
        run: python -m unittest discover -s tools/tests -v

  # The gates run through the native tools in tools/ozzit, built once with the
  # toolchain rust-toolchain.toml pins. The Python tools stay under test above.
  rust:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Restore the dependency build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/ozzit
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the native tools' formatting
        run: cargo fmt --manifest-path tools/ozzit/Cargo.toml --check
      - name: Lint the native tools
        run: cargo clippy --locked --manifest-path tools/ozzit/Cargo.toml --all-targets -- -D warnings
      - name: Run the native tools' tests
        run: cargo test --locked --manifest-path tools/ozzit/Cargo.toml
      - name: Build the native tools
        run: cargo build --locked --release --manifest-path tools/ozzit/Cargo.toml
      - name: Check workbook integrity
        run: tools/ozzit/target/release/ozzit verify_workbook ozzit.xlsx
      - name: Check src/ reproduces the shipped functions
        run: tools/ozzit/target/release/ozzit verify_sources ozzit.xlsx src
      - name: Check each function's help describes its own parameters
        run: tools/ozzit/target/release/ozzit verify_signatures src
      - name: Check the published index records what each function replaced
        run: tools/ozzit/target/release/ozzit verify_previous_names functions.csv
      - name: Check the published index matches the current artefacts
        run: tools/ozzit/target/release/ozzit verify_index ozzit.xlsx src functions.csv
      - name: Check the cover label states the current cut and function count
        run: tools/ozzit/target/release/ozzit verify_cover ozzit.xlsx functions.csv CHANGELOG.md
      - name: Check the Advanced Formula Environment store matches src/
        run: tools/ozzit/target/release/ozzit verify_afe ozzit.xlsx src
      - name: Check each cached help spill matches its definition
        run: tools/ozzit/target/release/ozzit verify_help_spills ozzit.xlsx
      - name: Check retained native evidence and its provenance
        run: tools/ozzit/target/release/ozzit verify_native_evidence

  verify-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [lint, verify, rust, coverage, dependency-audit, rust-coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Restore the dependency build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/ozzit
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the native aggregate gate
        run: cargo build --locked --manifest-path tools/ozzit/Cargo.toml
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: tools/ozzit/target/debug/ozzit check_gates .github/workflows/verify.yml verify-gates --exempt codecov

  # Measures the tool tests' branch coverage for the Codecov badge. This job
  # and codecov sit after verify-gates because they are CI measurements, not
  # contributor checks: AGENTS.md and CONTRIBUTING.md list the commands above it.
  coverage:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tool tests read history the release manifest pins, as in verify.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install the hash-pinned coverage tool
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=coverage --requirement requirements-coverage.txt
      - name: Install the pinned citation parser
        run: python -m pip install --only-binary ':all:' --require-hashes --requirement requirements-citation.txt
      - name: Run the unit tests under branch coverage
        run: python -m coverage run --branch --source=tools -m unittest discover -s tools/tests
      - name: Report coverage
        run: python -m coverage report --fail-under=100
      - name: Write coverage for Codecov
        run: python -m coverage xml -o coverage-codecov.xml
      - name: Keep the coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-codecov.xml
          retention-days: 1

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from verify-gates: a Codecov outage must not
  # block merges.
  codecov:
    name: upload coverage to Codecov
    needs: coverage
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml
          disable_search: true
          fail_ci_if_error: true

  # Audits the native tools' Cargo.lock against the RustSec advisory database.
  # It sits with the CI-only jobs because its result follows the advisory
  # database as well as the change.
  dependency-audit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Audit the native tools' locked dependencies
        working-directory: tools/ozzit
        run: cargo audit --deny warnings

  # Holds the native tools' tests to their measured line coverage. It sits with
  # the CI-only jobs because it needs cargo-llvm-cov, which the contributor
  # commands above do not. The floor is the measured line coverage, rounded down
  # (95.75% on 3 November 2026). Raise it with the tests, never lower it to pass.
  rust-coverage:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The native tests read history, as in rust.
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Add the coverage instrumentation tools
        run: rustup component add llvm-tools
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Run the native tools' tests under line coverage
        run: cargo llvm-cov --locked --manifest-path tools/ozzit/Cargo.toml --fail-under-lines 95
