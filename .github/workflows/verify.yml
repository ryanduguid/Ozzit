name: Verify workbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On a pull request, a push that supersedes an earlier one cancels it rather than
# paying for both. Every other run is keyed on its commit, as the attribution workflow's
# are: a shared group would let a later push to main replace a pending run, and that
# merged commit would never be verified.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The gates only read files. Nothing here needs write access to the repository.
permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install the pinned linter
        run: python -m pip install "ruff==0.16.6"
      - name: Lint the workbook tools and their tests
        run: python -m ruff check .
      - name: Install the pinned type checker
        run: python -m pip install "mypy==2.3.1"
      - name: Type-check production workbook tools
        run: python -m mypy --config-file mypy.ini

  verify:
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release manifest pins the commit that last changed ozzit.xlsx.
          # A shallow clone cannot prove that historical claim.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check workbook integrity
        run: python tools/verify_workbook.py ozzit.xlsx
      - name: Check src/ reproduces the shipped functions
        run: python tools/verify_sources.py ozzit.xlsx src
      - name: Check each function's help describes its own parameters
        run: python tools/verify_signatures.py src
      - name: Check the published index records what each function replaced
        run: python tools/verify_previous_names.py functions.csv
      - name: Check the published index matches the current artefacts
        run: python tools/verify_index.py ozzit.xlsx src functions.csv
      - name: Check the cover label states the current cut and function count
        run: python tools/verify_cover.py ozzit.xlsx functions.csv CHANGELOG.md
      - name: Check the Advanced Formula Environment store matches src/
        run: python tools/verify_afe.py ozzit.xlsx src
      - name: Check each cached help spill matches its definition
        run: python tools/verify_help_spills.py ozzit.xlsx
      - name: Check retained native evidence and its provenance
        run: python tools/verify_native_evidence.py
      - name: Run tool regression tests
        run: python -m unittest discover -s tools/tests -v

  verify-gates:
    # The one context branch protection requires from this workflow. It runs
    # on every event and fails unless every job it needs succeeded, and its
    # last step fails when a job in this file is missing from needs, so a new
    # job or matrix leg is enforced without a protection change.
    needs: [lint, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every needed job to succeed
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, value in results.items() if value["result"] != "success"]
          if failed:
              raise SystemExit("Jobs did not succeed: " + ", ".join(failed))
      - name: Check out the workflow definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: Require needs to list every other job in this file
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os, re
          text = open(".github/workflows/verify.yml", encoding="utf-8").read()
          block = re.split(r"(?m)^(?=[^\s#])", text.split("\njobs:\n", 1)[1], maxsplit=1)[0]
          key = re.compile(r"""(["']?)([A-Za-z_][\w-]*)\1[ \t]*:(?:[ \t]|$)""")
          jobs = set()
          for line in block.splitlines():
              if line.startswith("  ") and line[2:3] not in ("", " ", "#"):
                  match = key.match(line[2:])
                  if match is None:
                      raise SystemExit("Cannot read the job key " + repr(line) + "; the gate check needs updating")
                  jobs.add(match[2])
          if "verify-gates" not in jobs:
              raise SystemExit("Could not read the job list; the gate check needs updating")
          missing = sorted(jobs - {"verify-gates"} - set(json.loads(os.environ["RESULTS"])))
          if missing:
              raise SystemExit("Add these jobs to needs: " + ", ".join(missing))
