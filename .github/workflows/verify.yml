name: Verify workbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Check workbook integrity
        run: python tools/verify_workbook.py nabla.xlsx
      - name: Check src/ reproduces the shipped functions
        run: python tools/verify_sources.py nabla.xlsx src
      - name: Check each function's help describes itself
        run: python tools/verify_signatures.py src
