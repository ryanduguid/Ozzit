[package]
name = "ozzit-tools"
version = "4.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
description = "Deterministic workbook build and verification tooling for Ozzit"

[lib]
name = "ozzit"

[[bin]]
name = "ozzit"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crc32fast = "1.5.2"
fancy-regex = "0.19.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
indexmap = "2.14.2"
num-bigint = "0.4.8"
num-traits = "0.2.19"
roxmltree = "0.21.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = true

# Dependencies are optimised in test builds; the crate itself stays at
# debug opt-level so its own panics and overflow checks keep their detail.
[profile.dev.package."*"]
opt-level = 3
