[package]
name = "ozzit-tools"
version = "4.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
description = "Deterministic workbook build and verification tooling for Ozzit"
default-run = "ozzit"

[lib]
name = "ozzit"

[[bin]]
name = "ozzit"
path = "src/main.rs"

[[bin]]
name = "build_practice_calculators"
path = "src/bin/build_practice_calculators.rs"

[dependencies]
base64 = "0.23.1"
crc32fast = "1.5.2"
fancy-regex = "0.20.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
indexmap = "2.14.2"
# The system time zone, read from the zoneinfo files or, on Windows, a bundled copy.
jiff = { version = "1.0.0", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"
roxmltree = "0.21.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"

[lints.clippy]
too_many_lines = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

# Dependencies are optimised in test builds; the crate itself stays at
# debug opt-level so its own panics and overflow checks keep their detail.
[profile.dev.package."*"]
opt-level = 3
